    <script>
        lucide.createIcons();

        // ★★★ 記事データをすべて復活させました ★★★
        // ← news-data.js で定義済み（外部ファイル参照）

                const ARTICLES_PER_PAGE = 12;
        let currentPage = 1;

        function getTotalPages() {
            return Math.ceil(allArticles.length / ARTICLES_PER_PAGE);
        }

        function normalizePage(page) {
            const totalPages = getTotalPages();
            const parsed = Number(page);
            if (!Number.isFinite(parsed)) return 1;
            return Math.min(Math.max(Math.trunc(parsed), 1), totalPages);
        }

        function getPageUrl(page) {
            const normalized = normalizePage(page);
            const url = new URL(window.location.href);
            if (normalized === 1) {
                url.searchParams.delete('page');
            } else {
                url.searchParams.set('page', normalized);
            }
            return `${url.pathname}${url.search}${url.hash}`;
        }

        function getPageFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return normalizePage(params.get('page') || 1);
        }

        function buildCard(data, pageUrl) {
            const imgSrc = data.image || categoryImages[data.tag] || defaultImage;
            return `
                <a href="${pageUrl}" class="bg-white rounded-wa overflow-hidden shadow-sm hover:shadow-xl transition-all group border border-gray-100 flex flex-col h-full transform hover:-translate-y-1">
                    <div class="h-48 bg-white relative overflow-hidden flex-shrink-0 flex items-center justify-center p-2">
                        <img src="${imgSrc}" alt="${data.title}" class="w-full h-full object-contain object-center transition-all duration-500 group-hover:-translate-y-1">
                        <div class="absolute inset-0 bg-black/10 group-hover:bg-black/0 transition-colors"></div>
                        <span class="absolute top-4 left-4 bg-wa-brand text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-md z-10">${data.tag}</span>
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <h3 class="text-lg font-bold text-wa-text leading-snug text-balance group-hover:text-wa-brand transition-colors mb-3">${data.title}</h3>
                        <p class="text-[15px] md:text-base text-wa-gray line-clamp-2 opacity-80 mt-auto">
                            この記事では、工務店の現場で実際に起きている課題を解決するための...
                            <span class="text-wa-brand text-xs font-bold ml-1">詳細を見る</span>
                        </p>
                    </div>
                </a>`;
        }

        function renderPage(page, options = {}) {
            const { updateHistory = false, scrollToTop = true, historyMode = 'push' } = options;
            currentPage = normalizePage(page);
            const grid = document.getElementById('news-grid');
            grid.innerHTML = '';
            const start = (currentPage - 1) * ARTICLES_PER_PAGE;
            const end = Math.min(start + ARTICLES_PER_PAGE, allArticles.length);
            for (let i = start; i < end; i++) {
                grid.insertAdjacentHTML('beforeend', buildCard(allArticles[i], 'news/' + articleFiles[i]));
            }
            renderPagination();

            if (updateHistory) {
                const url = getPageUrl(currentPage);
                const state = { page: currentPage };
                if (historyMode === 'replace') {
                    window.history.replaceState(state, '', url);
                } else {
                    window.history.pushState(state, '', url);
                }
            }

            if (scrollToTop && currentPage > 1) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function renderPagination() {
            const totalPages = getTotalPages();
            const pager = document.getElementById('pagination-container');
            pager.innerHTML = '';
            for (let p = 1; p <= totalPages; p++) {
                const isActive = p === currentPage;
                const link = document.createElement('a');
                link.textContent = p;
                link.href = getPageUrl(p);
                link.setAttribute('aria-label', `記事一覧の${p}ページ目へ`);
                if (isActive) {
                    link.setAttribute('aria-current', 'page');
                }
                link.className = isActive
                    ? 'w-10 h-10 flex items-center justify-center bg-wa-brand text-white rounded font-bold cursor-default select-none'
                    : 'w-10 h-10 flex items-center justify-center border border-wa-gray/30 text-wa-text rounded hover:bg-white transition-colors cursor-pointer select-none';

                if (!isActive) {
                    link.addEventListener('click', function(event) {
                        event.preventDefault();
                        renderPage(p, { updateHistory: true, scrollToTop: true, historyMode: 'push' });
                    });
                }

                pager.appendChild(link);
            }
        }

        window.addEventListener('popstate', function() {
            renderPage(getPageFromUrl(), { updateHistory: false, scrollToTop: false });
        });

        renderPage(getPageFromUrl(), { updateHistory: true, scrollToTop: false, historyMode: 'replace' });
    </script>

        menu.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    document.addEventListener('DOMContentLoaded', function() {
        const button = document.getElementById('mobile-menu-btn');
        if (button) {
            button.addEventListener('click', openMobileMenu);
        }
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') closeMobileMenu();
        });
    });
})();
